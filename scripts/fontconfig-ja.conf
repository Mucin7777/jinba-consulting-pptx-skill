<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Linux（Claude Code のクラウド環境など）で、パーツ集が指定する Mac / Windows の和文書体を Noto CJK JP で描く。
  これが無いと、和文が中国語の字形（WenQuanYi など）で描かれ、見出しの明朝もゴシックになる。
  scripts/setup_linux.sh が ~/.config/fontconfig/conf.d/ に置く（要 fonts-noto-cjk）。
-->
<fontconfig>
  <!-- ゴシック: パーツ集の font-sans と SVG の font-family="Yu Gothic" -->
  <match target="pattern">
    <test name="family" qual="any"><string>Yu Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>YuGothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Hiragino Kaku Gothic ProN</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Meiryo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <!-- 明朝: パーツ集の font-serif と SVG の font-family="Yu Mincho" -->
  <match target="pattern">
    <test name="family" qual="any"><string>Yu Mincho</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>YuMincho</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Hiragino Mincho ProN</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <!-- 総称 sans-serif / serif で和文を描くときも中国語の書体より先に Noto CJK JP -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif CJK JP</string></edit>
  </match>
</fontconfig>
